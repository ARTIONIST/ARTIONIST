services:
  - type: web
    name: mmi-psai-x1
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn mmi_psai_x1.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MMI_PROVIDERS
        value: mock
      - key: MMI_RATE_LIMIT
        value: 20/hour
      - key: MMI_INVESTIGATE_LIMIT
        value: 5/minute
